name: Feature request · 功能建议
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题？
      description: 描述痛点或使用场景。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望怎样被解决？欢迎附草图 / 参考链接。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其他做法？
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 引擎核心（AgentLoop / Brain / Executor）
        - 技能系统 / 市场
        - 记忆 / RAG / 知识库
        - Web / 控制台 UI
        - 安全 / 沙箱
        - 多智能体 / 工作流 / 定时任务
        - 文档 / 教程
        - 其他
    validations:
      required: true
