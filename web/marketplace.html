<!DOCTYPE html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>技能市场 · Skill Marketplace</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2318c8ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='70' font-size='54' font-weight='700' font-family='Arial,sans-serif' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --radius: 18px;
    --accent-a: #7c5cff;
    --accent-b: #18c8ff;
    --accent-grad: linear-gradient(135deg, #7c5cff 0%, #18c8ff 100%);
    --danger: #ff5c7c;
    --ok: #2fd27a;
    --warn: #ffb347;
  }
  html[data-theme="dark"] {
    --bg: #0a0e1a;
    --bg-2: #0e1426;
    --surface: rgba(255,255,255,0.045);
    --surface-strong: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.10);
    --text: #e9edf6;
    --text-dim: #9aa6c0;
    --shadow: 0 18px 50px rgba(0,0,0,0.45);
  }
  html[data-theme="light"] {
    --bg: #eef1f8;
    --bg-2: #e4e9f4;
    --surface: rgba(255,255,255,0.65);
    --surface-strong: rgba(255,255,255,0.9);
    --border: rgba(20,30,60,0.10);
    --text: #16203a;
    --text-dim: #5b688a;
    --shadow: 0 18px 50px rgba(40,60,120,0.16);
  }
  html[data-theme="system"] { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    html[data-theme="system"] {
      --bg: #0a0e1a; --bg-2: #0e1426; --surface: rgba(255,255,255,0.045);
      --surface-strong: rgba(255,255,255,0.08); --border: rgba(255,255,255,0.10);
      --text: #e9edf6; --text-dim: #9aa6c0; --shadow: 0 18px 50px rgba(0,0,0,0.45);
    }
  }
  @media (prefers-color-scheme: light) {
    html[data-theme="system"] {
      --bg: #eef1f8; --bg-2: #e4e9f4; --surface: rgba(255,255,255,0.65);
      --surface-strong: rgba(255,255,255,0.9); --border: rgba(20,30,60,0.10);
      --text: #16203a; --text-dim: #5b688a; --shadow: 0 18px 50px rgba(40,60,120,0.16);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font); color: var(--text);
    background:
      radial-gradient(1200px 600px at 12% -8%, rgba(124,92,255,0.18), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(24,200,255,0.14), transparent 55%),
      var(--bg);
    min-height: 100vh; transition: background .4s ease, color .3s ease;
  }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 80px; }

  /* ── Header ── */
  header.top {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .logo {
    width: 44px; height: 44px; border-radius: 13px; background: var(--accent-grad);
    display: grid; place-items: center; font-size: 22px; box-shadow: 0 8px 26px rgba(124,92,255,0.45);
    flex: none;
  }
  .brand h1 { font-size: 22px; margin: 0; letter-spacing: .3px; font-weight: 700; }
  .brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-dim); }
  .spacer { flex: 1; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; font-size: 17px;
    display: grid; place-items: center; transition: transform .25s cubic-bezier(.16,1,.3,1), background .2s;
    backdrop-filter: blur(14px);
  }
  .icon-btn:hover { transform: translateY(-2px) scale(1.05); background: var(--surface-strong); }
  .btn-primary {
    border: none; cursor: pointer; color: #fff; font-weight: 600; font-size: 14px;
    padding: 11px 18px; border-radius: 13px; background: var(--accent-grad);
    box-shadow: 0 10px 26px rgba(124,92,255,0.42); transition: transform .25s cubic-bezier(.16,1,.3,1), filter .2s;
  }
  .btn-primary:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.06); }
  .btn-ghost {
    border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
    font-weight: 600; font-size: 14px; padding: 11px 16px; border-radius: 13px; transition: transform .2s, background .2s;
    backdrop-filter: blur(14px);
  }
  .btn-ghost:hover { transform: translateY(-2px); background: var(--surface-strong); }

  /* ── Source Tabs ── */
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab {
    padding: 10px 20px; border-radius: 13px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); font-size: 14.5px; font-weight: 600; cursor: pointer; backdrop-filter: blur(14px);
    transition: all .2s;
  }
  .tab:hover { color: var(--text); transform: translateY(-1px); }
  .tab.active { color: #fff; background: var(--accent-grad); border-color: transparent; box-shadow: 0 8px 22px rgba(124,92,255,0.34); }

  /* ── Toolbar ── */
  .toolbar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;
  }
  .search { flex: 1; min-width: 220px; position: relative; }
  .search input {
    width: 100%; padding: 13px 16px 13px 42px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 14.5px; outline: none; backdrop-filter: blur(14px);
    transition: border .2s, box-shadow .2s;
  }
  .search input:focus { border-color: var(--accent-a); box-shadow: 0 0 0 4px rgba(124,92,255,0.16); }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: .5; }
  select.sort, .chip-toggle {
    padding: 12px 14px; border-radius: 13px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 14px; cursor: pointer; backdrop-filter: blur(14px); outline: none;
  }
  .chip-toggle { display: inline-flex; align-items: center; gap: 7px; user-select: none; }
  .chip-toggle.active { border-color: var(--accent-a); background: rgba(124,92,255,0.14); }

  .chips { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 20px; }
  .chip {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); font-size: 13px; cursor: pointer; transition: all .2s; backdrop-filter: blur(12px);
  }
  .chip:hover { color: var(--text); transform: translateY(-1px); }
  .chip.active { color: #fff; background: var(--accent-grad); border-color: transparent; font-weight: 600; }

  /* ── Grid ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
  .card {
    position: relative; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface-strong); padding: 18px;
    box-shadow: var(--shadow); cursor: pointer; overflow: hidden;
    transition: transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s, border-color .3s;
    /* 修复②：去掉每张卡片的 backdrop-filter（139 张卡的 backdrop-filter 在长列表滚动时会触发
       Chrome 合成层不重绘、整卡"消失"的缺陷），改用实心玻璃背景。
       注意：不要给 .card 加 content-visibility:auto —— 它会依赖交叉观察判定卡片是否在屏，
       点击/聚焦引起的布局失效会把"可见卡片"误判为离屏而整片折叠消失，正是"点哪都清空"的元凶。 */
  }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: var(--radius); padding: 1px;
    background: linear-gradient(135deg, rgba(124,92,255,.5), rgba(24,200,255,.35));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity .3s;
  }
  .card:hover { transform: translateY(-6px) scale(1.018); box-shadow: 0 26px 60px rgba(0,0,0,.35); }
  .card:hover::before { opacity: 1; }
  .card .cat {
    display: inline-block; font-size: 11.5px; padding: 4px 10px; border-radius: 999px;
    background: rgba(124,92,255,0.16); color: var(--accent-b); margin-bottom: 10px; font-weight: 600;
  }
  .card h3 { margin: 0 0 7px; font-size: 17px; }
  .card .desc { margin: 0 0 12px; font-size: 13.5px; color: var(--text-dim); line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .card .tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--surface-strong); color: var(--text-dim); }
  .card .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .badge { font-size: 11px; padding: 4px 9px; border-radius: 8px; font-weight: 700; letter-spacing: .3px; }
  .badge.sandboxed { background: rgba(255,179,71,0.16); color: var(--warn); }
  .badge.trusted { background: rgba(47,210,122,0.16); color: var(--ok); }
  .badge.installed { background: rgba(24,200,255,0.16); color: var(--accent-b); }
  .badge.downloaded { background: rgba(124,92,255,0.16); color: var(--accent-a); }
  .badge.remote { background: rgba(34,211,238,0.16); color: #22d3ee; }
  .badge.danger { background: rgba(255,92,124,0.18); color: var(--danger); }
  .stars { color: var(--warn); font-size: 13px; letter-spacing: 1px; }
  .stars .num { color: var(--text-dim); margin-left: 5px; font-size: 12px; letter-spacing: 0; }
  .card-btn {
    border: none; cursor: pointer; color: #fff; font-weight: 600; font-size: 13px; padding: 8px 14px;
    border-radius: 11px; background: var(--accent-grad); box-shadow: 0 6px 16px rgba(124,92,255,0.34);
    transition: transform .2s, filter .2s; white-space: nowrap;
  }
  .card-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .card-btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
  .card-btn:disabled { opacity: .6; cursor: default; transform: none; filter: none; }

  .empty { text-align: center; color: var(--text-dim); padding: 60px 20px; font-size: 15px; }

  /* ── Remote repo manager ── */
  .repo-manager {
    border: 1px solid var(--border); border-radius: 16px; background: var(--surface);
    backdrop-filter: blur(18px); padding: 16px; margin-bottom: 16px;
  }
  .repo-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .repo-item {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
    background: var(--surface-strong); border: 1px solid var(--border); font-size: 13px;
  }
  .repo-item .rm { cursor: pointer; color: var(--danger); font-weight: 700; }
  .add-repo { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-repo input {
    flex: 1; min-width: 160px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--bg-2); color: var(--text); font-size: 13px; outline: none;
  }
  .add-repo input:focus { border-color: var(--accent-a); }
  .hint-sm { font-size: 12px; color: var(--text-dim); margin: 10px 0 0; line-height: 1.5; }
  .src-settings { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .src-settings > summary {
    cursor: pointer; padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--text-dim);
    list-style: none; user-select: none; display: flex; align-items: center; gap: 6px;
  }
  .src-settings > summary::-webkit-details-marker { display: none; }
  .src-settings[open] > summary { border-bottom: 1px solid var(--border); }
  .src-settings .repo-manager { border: none; border-radius: 0; margin-bottom: 0; background: transparent; backdrop-filter: none; }
  .remote-errors { margin-top: 14px; }
  .remote-errors .err {
    font-size: 13px; padding: 10px 12px; border-radius: 11px; background: rgba(255,92,124,0.12);
    color: var(--danger); margin-bottom: 8px;
  }

  /* ── Drawer ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(5,8,18,0.55); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 40;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: min(460px, 92vw);
    background: var(--bg-2); border-left: 1px solid var(--border); box-shadow: -20px 0 60px rgba(0,0,0,.4);
    transform: translateX(102%); transition: transform .38s cubic-bezier(.16,1,.3,1); z-index: 50;
    display: flex; flex-direction: column;
  }
  .drawer.show { transform: translateX(0); }
  .drawer .dhead { padding: 22px 22px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; }
  .drawer .dhead h2 { margin: 0; font-size: 20px; }
  .drawer .dhead .sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .drawer .dbody { padding: 18px 22px 22px; overflow-y: auto; flex: 1; }
  .drawer .close { margin-left: auto; }
  .section { margin-bottom: 18px; }
  .section h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-dim); }
  .section p { margin: 0; font-size: 14px; line-height: 1.6; }
  .perms { display: flex; gap: 8px; flex-wrap: wrap; }
  .perm { font-size: 12px; padding: 5px 11px; border-radius: 9px; border: 1px solid var(--border); }
  .perm.on { background: rgba(255,92,124,0.12); color: var(--danger); border-color: transparent; }
  .perm.off { color: var(--text-dim); }
  .dflist { list-style: none; padding: 0; margin: 0; }
  .dflist li { font-size: 12.5px; padding: 8px 10px; border-radius: 9px; background: rgba(255,92,124,0.10);
    color: var(--danger); margin-bottom: 6px; }
  .dfoot { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
  .dfoot .btn-primary, .dfoot .btn-ghost { flex: 1; text-align: center; }

  /* rating widget */
  .rate { display: flex; gap: 4px; font-size: 24px; cursor: pointer; }
  .rate span { color: var(--text-dim); transition: transform .15s, color .15s; }
  .rate span.on { color: var(--warn); }
  .rate span:hover { transform: scale(1.15); }

  /* ── Modal ── */
  .modal {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 60; padding: 20px;
    background: rgba(5,8,18,0.6); backdrop-filter: blur(5px); opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal .panel {
    width: min(560px, 96vw); max-height: 90vh; overflow-y: auto; background: var(--bg-2);
    border: 1px solid var(--border); border-radius: 22px; padding: 24px; box-shadow: var(--shadow);
    transform: translateY(14px) scale(.98); transition: transform .3s cubic-bezier(.16,1,.3,1);
  }
  .modal.show .panel { transform: none; }
  .modal h2 { margin: 0 0 4px; font-size: 19px; }
  .modal .hint { color: var(--text-dim); font-size: 13px; margin: 0 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-dim); }
  .field input, .field textarea, .field select {
    width: 100%; padding: 11px 13px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 14px; outline: none; font-family: var(--font);
  }
  .field textarea { min-height: 110px; resize: vertical; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent-a); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-size: 13.5px; cursor: pointer; }
  .modal .actions { display: flex; gap: 10px; margin-top: 8px; }
  .modal .actions button { flex: 1; }

  /* ── Toast ── */
  .toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .toast {
    padding: 12px 18px; border-radius: 13px; background: var(--surface-strong); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; box-shadow: var(--shadow); backdrop-filter: blur(16px);
    animation: toastIn .3s cubic-bezier(.16,1,.3,1); max-width: 86vw;
  }
  .toast.err { border-color: rgba(255,92,124,.5); color: var(--danger); }
  .toast.ok { border-color: rgba(47,210,122,.5); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .skeleton { height: 200px; border-radius: var(--radius); background: linear-gradient(100deg, var(--surface) 30%, var(--surface-strong) 50%, var(--surface) 70%); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  @media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } .brand p { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">💎</div>
      <div>
        <h1>技能市场</h1>
        <p>Skill Marketplace · 社区分享 · 自托管注册中心</p>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" title="切换主题">🌗</button>
    <button class="btn-primary" id="publishBtn">+ 发布技能</button>
  </header>

  <div class="tabs" id="srcTabs">
    <button class="tab active" data-src="local">本地市场</button>
    <button class="tab" data-src="remote">GitHub 远程</button>
  </div>

  <!-- 本地市场视图 -->
  <div id="localView">
    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" placeholder="搜索技能、标签、分类…" autocomplete="off" readonly />
      </div>
      <select class="sort" id="sortSel">
        <option value="popular">最热门</option>
        <option value="rating">评分最高</option>
        <option value="newest">最新发布</option>
        <option value="name">名称 A-Z</option>
      </select>
      <label class="chip-toggle" id="installedToggle"><input type="checkbox" style="display:none" /> 仅看已安装</label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">没有匹配的技能，换个关键词试试。</div>
  </div>

  <!-- GitHub 远程视图（仿 skillhub：默认列出全部、分类、一键安装，仓库/Token 收进高级设置） -->
  <div id="remoteView" style="display:none">
    <details class="src-settings">
      <summary>⚙ 数据源设置（高级）</summary>
      <div class="repo-manager">
        <div class="repo-list" id="repoList"></div>
        <div class="add-repo">
          <input id="repoInput" placeholder="添加 GitHub 仓库（owner/repo 或完整链接）" />
          <input id="tokenInput" type="password" placeholder="GitHub Token（可选，提升速率）" />
          <button class="btn-ghost" id="addRepoBtn">添加</button>
          <button class="btn-ghost" id="refreshRemoteBtn">↻ 刷新</button>
        </div>
        <p class="hint-sm">默认已接入 <b>anthropics/skills</b> 作为远程市场；无需填任何链接或密钥即可浏览与安装。遇到 GitHub 匿名限速（60 次/小时）可在此填 Token 或换其他仓库。</p>
      </div>
    </details>
    <div class="toolbar">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="remoteSearch" placeholder="搜索技能、标签、分类…" autocomplete="off" readonly />
      </div>
    </div>
    <div class="chips" id="remoteChips"></div>
    <div class="grid" id="remoteGrid"></div>
    <div class="empty" id="remoteEmpty" style="display:none">没有匹配的远程技能，换个关键词试试。</div>
    <div class="remote-errors" id="remoteErrors"></div>
  </div>
</div>

<!-- Drawer -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="dhead">
    <div>
      <h2 id="dName">—</h2>
      <div class="sub" id="dSub">—</div>
    </div>
    <button class="icon-btn close" id="drawerClose">✕</button>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot" id="dFoot"></div>
</aside>

<!-- Publish Modal -->
<div class="modal" id="modal">
  <div class="panel">
    <h2>发布技能到市场</h2>
    <p class="hint">复制一个已有技能（填 slug/名称），或直接新建（填名称 + 正文）。发布后会打包为 .skill、计算 sha256 并扫描危险脚本。</p>
    <div class="field">
      <label>来源技能名 / slug（复制模式，可留空走新建）</label>
      <input id="pSlug" placeholder="例如 pdf / docx / offline-office" />
    </div>
    <div class="row2">
      <div class="field">
        <label>技能名称（新建必填）</label>
        <input id="pName" placeholder="我的技能" />
      </div>
      <div class="field">
        <label>版本</label>
        <input id="pVersion" placeholder="1.0.0" value="1.0.0" />
      </div>
    </div>
    <div class="field">
      <label>一句话描述</label>
      <input id="pDesc" placeholder="这个技能能做什么" />
    </div>
    <div class="field">
      <label>SKILL.md 正文（新建模式）</label>
      <textarea id="pBody" placeholder="# 技能名&#10;&#10;执行步骤…"></textarea>
    </div>
    <div class="row2">
      <div class="field">
        <label>分类</label>
        <input id="pCategory" placeholder="如 文档/写作" />
      </div>
      <div class="field">
        <label>标签（逗号分隔）</label>
        <input id="pTags" placeholder="pdf, 文档, 转换" />
      </div>
    </div>
    <div class="field">
      <label>声明的权限（默认全关 → 沙箱运行）</label>
      <div class="checks">
        <label><input type="checkbox" id="pNet" /> 网络</label>
        <label><input type="checkbox" id="pWrite" /> 文件写</label>
        <label><input type="checkbox" id="pShell" /> Shell</label>
      </div>
    </div>
    <div class="field">
      <label>信任级</label>
      <select id="pTrust"><option value="sandboxed">sandboxed（默认·受限沙箱）</option><option value="trusted">trusted（直接运行）</option></select>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="modalCancel">取消</button>
      <button class="btn-primary" id="modalSubmit">发布</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const api = (p, opt) => fetch(p, { cache: 'no-store', ...(opt || {}) }).then(r => r.json());

  // ── 主题 ──
  const THEME_KEY = 'ah_marketplace_theme';
  function applyTheme(t) { document.documentElement.setAttribute('data-theme', t); }
  applyTheme(localStorage.getItem(THEME_KEY) || 'system');
  $('#themeBtn').onclick = () => {
    const order = ['system', 'light', 'dark'];
    const cur = document.documentElement.getAttribute('data-theme');
    const next = order[(order.indexOf(cur) + 1) % 3];
    applyTheme(next); localStorage.setItem(THEME_KEY, next);
    toast('主题：' + ({ system: '跟随系统', light: '亮色', dark: '暗色' }[next]));
  };

  // ── 状态 ──
  const state = { src: 'local', q: '', category: 'all', tag: '', sort: 'popular', installedOnly: false, categories: [], remoteCategory: 'all' };
  let remoteSkills = [], remoteErrors = [], remoteRepos = [];

  // ── 工具 ──
  function toast(msg, kind) {
    const t = document.createElement('div');
    t.className = 'toast' + (kind ? ' ' + kind : '');
    t.textContent = msg;
    $('#toasts').appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 2600);
  }
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function starsHtml(rating, count) {
    const full = Math.round(rating);
    let s = '';
    for (let i = 1; i <= 5; i++) s += i <= full ? '★' : '☆';
    return '<span class="stars">' + s + (count ? '<span class="num">' + rating.toFixed(1) + ' · ' + count + '</span>' : '') + '</span>';
  }
  function permBadge(name, on) { return '<span class="perm ' + (on ? 'on' : 'off') + '">' + name + (on ? ' ✓' : ' ✕') + '</span>'; }

  // ══════ 来源 Tab 切换 ══════
  $('#srcTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab'); if (!btn) return;
    setSrc(btn.dataset.src);
  });
  function setSrc(src) {
    state.src = src;
    document.querySelectorAll('#srcTabs .tab').forEach(b => b.classList.toggle('active', b.dataset.src === src));
    $('#localView').style.display = src === 'local' ? '' : 'none';
    $('#remoteView').style.display = src === 'remote' ? '' : 'none';
    $('#publishBtn').style.display = src === 'local' ? '' : 'none';
    if (src === 'remote') { loadRemoteConfig(); loadRemote('', true); }
    else { applyFilter(); }
  }

  // ══════ 本地市场 ══════
  async function loadCategories() {
    try { const c = await api('/api/marketplace/categories'); state.categories = c.categories || []; renderChips(); }
    catch (e) { /* ignore */ }
  }
  function renderChips() {
    const wrap = $('#chips'); const all = ['all', ...state.categories]; wrap.innerHTML = '';
    all.forEach(cat => {
      const el = document.createElement('div');
      el.className = 'chip' + (state.category === cat ? ' active' : '');
      el.textContent = cat === 'all' ? '全部' : cat;
      el.onclick = () => { state.category = cat; renderChips(); applyFilter(); };
      wrap.appendChild(el);
    });
  }
  let loadTimer;
  let allSkills = [];
  async function loadAll() {
    const grid = $('#grid');
    grid.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    $('#empty').style.display = 'none';
    try {
      const data = await api('/api/marketplace/skills');
      allSkills = (data.skills || []);
    } catch (e) { allSkills = []; }
    applyFilter();
  }
  // 客户端过滤：全部技能已一次性载入内存，分类/搜索/排序/仅已安装在本地完成，
  // 彻底规避「点类目→再发接口→浏览器/缓存导致返回空」的真实浏览器问题。
  function applyFilter() {
    const grid = $('#grid');
    let list = allSkills.slice();
    const ql = (state.q || '').trim().toLowerCase();
    if (ql) list = list.filter(s => (s.name || '').toLowerCase().includes(ql) || (s.description || '').toLowerCase().includes(ql) || (s.tags || []).some(t => t.toLowerCase().includes(ql)) || (s.category || '').toLowerCase().includes(ql));
    if (state.category && state.category !== 'all') list = list.filter(s => (s.category || '其他') === state.category);
    if (state.tag) list = list.filter(s => (s.tags || []).includes(state.tag));
    if (state.installedOnly) list = list.filter(s => s.installed);
    const sort = state.sort || 'popular';
    list.sort((a, b) => {
      if (sort === 'rating') return (b.rating || 0) - (a.rating || 0) || (b.ratingsCount || 0) - (a.ratingsCount || 0);
      if (sort === 'newest') return (b.updatedAt || 0) - (a.updatedAt || 0) || (b.publishedAt || 0) - (a.publishedAt || 0);
      if (sort === 'name') return (a.name || '').localeCompare(b.name || '');
      return (Number(b.installed) || 0) + (b.ratingsCount || 0) - ((Number(a.installed) || 0) + (a.ratingsCount || 0));
    });
    if (!list.length) { grid.innerHTML = ''; $('#empty').style.display = 'block'; return; }
    grid.innerHTML = ''; list.forEach(s => grid.appendChild(localCard(s)));
  }
  const reload = loadAll; // 兼容旧调用（发布/安装/卸载后整列刷新）
  function localCard(s) {
    const el = document.createElement('div'); el.className = 'card';
    const danger = (s.dangerFlags || []).length;
    el.innerHTML =
      '<span class="cat">' + esc(s.category || '其他') + '</span>' +
      '<h3>' + esc(s.name) + '</h3>' +
      '<p class="desc">' + esc(s.description || '（无描述）') + '</p>' +
      '<div class="tags">' + (s.tags || []).slice(0, 4).map(t => '<span class="tag">#' + esc(t) + '</span>').join('') + '</div>' +
      '<div class="meta">' +
        '<div>' +
          (s.installed ? '<span class="badge installed">已安装</span> ' : '') +
          '<span class="badge ' + s.trust + '">' + (s.trust === 'trusted' ? 'TRUSTED' : 'SANDBOX') + '</span>' +
          (danger ? ' <span class="badge danger">⚠ ' + danger + '</span>' : '') +
        '</div>' +
        starsHtml(s.rating || 0, s.ratingsCount || 0) +
      '</div>';
    el.onclick = () => openDrawer(s.slug, false);
    return el;
  }

  $('#searchInput').addEventListener('input', (e) => { clearTimeout(loadTimer); loadTimer = setTimeout(() => { state.q = e.target.value.trim(); applyFilter(); }, 280); });
  $('#sortSel').addEventListener('change', (e) => { state.sort = e.target.value; applyFilter(); });
  $('#installedToggle').addEventListener('click', () => { state.installedOnly = !state.installedOnly; $('#installedToggle').classList.toggle('active', state.installedOnly); applyFilter(); });

  // 修复：搜索框禁用浏览器自动填充。用户浏览器曾保存过 openrouter 等地址，会自动灌进搜索框，
  // 之后任意点击触发 input 过滤时按该地址筛 → 全部技能消失。readonly 阻止自动填充，聚焦时再放开编辑。
  ['#searchInput', '#remoteSearch'].forEach((sel) => {
    const el = $(sel); if (!el) return;
    el.addEventListener('focus', () => el.removeAttribute('readonly'));
  });

  // ══════ GitHub 远程 ══════
  async function loadRemoteConfig() {
    try { const c = await api('/api/marketplace/remote/config'); remoteRepos = c.repos || []; renderRepos(); }
    catch (e) { remoteRepos = []; renderRepos(); }
  }
  function renderRepos() {
    const wrap = $('#repoList'); wrap.innerHTML = '';
    remoteRepos.forEach(r => {
      const el = document.createElement('div'); el.className = 'repo-item';
      el.innerHTML = '<span>' + esc(r.label || r.url) + '</span><span class="rm" title="移除">✕</span>';
      el.querySelector('.rm').onclick = () => removeRepo(r.url);
      wrap.appendChild(el);
    });
  }
  $('#addRepoBtn').onclick = async () => {
    const url = $('#repoInput').value.trim(); if (!url) { toast('请填写仓库地址', 'err'); return; }
    const token = $('#tokenInput').value.trim();
    const exists = remoteRepos.some(r => r.url === url);
    const repos = exists ? remoteRepos : [...remoteRepos, { url, label: url }];
    const r = await api('/api/marketplace/remote/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repos, token }) });
    if (r.error) { toast(r.error, 'err'); return; }
    $('#repoInput').value = ''; remoteRepos = (r.config && r.config.repos) || repos; renderRepos(); loadRemote('', true); toast('已添加仓库', 'ok');
  };
  async function removeRepo(url) {
    const repos = remoteRepos.filter(r => r.url !== url);
    const r = await api('/api/marketplace/remote/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repos, token: $('#tokenInput').value.trim() }) });
    if (r.error) { toast(r.error, 'err'); return; }
    remoteRepos = (r.config && r.config.repos) || repos; renderRepos(); loadRemote('', true);
  }
  let remoteTimer;
  $('#remoteSearch').addEventListener('input', (e) => { clearTimeout(remoteTimer); const v = e.target.value.trim(); remoteTimer = setTimeout(() => loadRemote(v, false), 280); });
  $('#refreshRemoteBtn').onclick = () => loadRemote($('#remoteSearch').value.trim(), true);

  async function loadRemote(q, force) {
    const grid = $('#remoteGrid');
    grid.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    $('#remoteEmpty').style.display = 'none'; $('#remoteErrors').innerHTML = '';
    const qs = new URLSearchParams(); if (q) qs.set('q', q); if (force) qs.set('force', '1');
    try {
      const data = await api('/api/marketplace/remote?' + qs.toString());
      remoteSkills = data.skills || []; remoteErrors = data.errors || [];
      renderRemoteChips();
      renderRemoteGrid();
      renderRemoteErrors();
    } catch (e) { grid.innerHTML = ''; $('#remoteEmpty').style.display = 'block'; }
  }
  function renderRemoteChips() {
    const wrap = $('#remoteChips'); wrap.innerHTML = '';
    const cats = Array.from(new Set(remoteSkills.map(s => s.category || '其他'))).sort();
    ['all', ...cats].forEach(cat => {
      const el = document.createElement('div');
      el.className = 'chip' + (state.remoteCategory === cat ? ' active' : '');
      el.textContent = cat === 'all' ? '全部' : cat;
      el.onclick = () => { state.remoteCategory = cat; renderRemoteChips(); renderRemoteGrid(); };
      wrap.appendChild(el);
    });
  }
  function renderRemoteGrid() {
    const grid = $('#remoteGrid'); grid.innerHTML = '';
    const list = remoteSkills.filter(s => state.remoteCategory === 'all' || (s.category || '其他') === state.remoteCategory);
    if (!list.length) { $('#remoteEmpty').style.display = 'block'; return; }
    $('#remoteEmpty').style.display = 'none';
    list.forEach(s => grid.appendChild(remoteCard(s)));
  }
  function renderRemoteErrors() {
    const wrap = $('#remoteErrors'); wrap.innerHTML = '';
    (remoteErrors || []).forEach(msg => { const d = document.createElement('div'); d.className = 'err'; d.textContent = '⚠ ' + msg; wrap.appendChild(d); });
  }
  function remoteCard(s) {
    const el = document.createElement('div'); el.className = 'card';
    const danger = (s.dangerFlags || []).length;
    let btn = '<button class="card-btn" data-act="install-remote">安装</button>';
    if (s.installed) btn = '<button class="card-btn" disabled>已安装</button>';
    el.innerHTML =
      '<span class="cat">' + esc(s.category || '其他') + '</span>' +
      '<h3>' + esc(s.name) + '</h3>' +
      '<p class="desc">' + esc(s.description || '（无描述）') + '</p>' +
      '<div class="tags">' + (s.tags || []).slice(0, 4).map(t => '<span class="tag">#' + esc(t) + '</span>').join('') + '</div>' +
      '<div class="meta">' +
        '<div>' +
          '<span class="badge remote">GitHub</span> ' +
          (s.installed ? '<span class="badge installed">已安装</span> ' : '') +
          '<span class="badge ' + s.trust + '">' + (s.trust === 'trusted' ? 'TRUSTED' : 'SANDBOX') + '</span>' +
          (danger ? ' <span class="badge danger">⚠ ' + danger + '</span>' : '') +
        '</div>' + btn +
      '</div>';
    el.onclick = () => openDrawer(s.slug, true);
    const b = el.querySelector('.card-btn');
    if (b && !b.disabled) b.onclick = (ev) => { ev.stopPropagation(); remoteAction(s); };
    return el;
  }
  async function remoteAction(s) {
    if (s.installed) { toast('已安装：' + s.name); return; }
    toast('安装中：' + s.name + '（下载并解包）…');
    try {
      const r = await api('/api/marketplace/skills/' + encodeURIComponent(s.slug) + '/install-remote', { method: 'POST' });
      if (r.error) { toast(r.error, 'err'); return; }
      if (r.dangerFlags && r.dangerFlags.length) toast('⚠ 检出 ' + r.dangerFlags.length + ' 处危险脚本，已沙箱安装', 'err');
      toast('已安装：' + (r.entry ? r.entry.name : s.name), 'ok');
      loadRemote($('#remoteSearch').value.trim(), false);
    } catch (e) { toast('安装失败', 'err'); }
  }

  // ══════ Drawer（本地 + 远程共用）══════
  async function openDrawer(slug, isRemote) {
    let s;
    if (isRemote) { s = remoteSkills.find(x => x.slug === slug); if (!s) { toast('未找到该远程技能', 'err'); return; } }
    else {
      s = await api('/api/marketplace/skills/' + encodeURIComponent(slug));
      if (s.error) { toast(s.error, 'err'); return; }
    }
    $('#dName').textContent = s.name;
    $('#dSub').textContent = 'v' + s.version + (s.author ? ' · by ' + s.author : '') + ' · ' + s.category + (isRemote ? ' · GitHub' : '');
    const perms = s.permissions || {}; const df = s.dangerFlags || [];
    $('#dBody').innerHTML =
      '<div class="section"><h4>描述</h4><p>' + esc(s.description || '（无）') + '</p></div>' +
      '<div class="section"><h4>标签</h4><div class="tags">' + (s.tags || []).map(t => '<span class="tag">#' + esc(t) + '</span>').join('') + '</div></div>' +
      '<div class="section"><h4>信任级 / 状态</h4><p>' +
        '<span class="badge ' + s.trust + '">' + (s.trust === 'trusted' ? 'TRUSTED · 直接运行' : 'SANDBOX · 受限沙箱') + '</span> ' +
        (s.installed ? '<span class="badge installed">已安装</span>' : (s.source === 'remote' ? '<span class="badge remote">未下载</span>' : '<span class="badge">未安装</span>')) + '</p></div>' +
      '<div class="section"><h4>声明权限</h4><div class="perms">' +
        permBadge('网络', perms.network) + permBadge('文件写', perms.fileWrite) + permBadge('Shell', perms.shell) +
      '</div></div>' +
      (df.length ? '<div class="section"><h4>⚠ 危险脚本扫描（' + df.length + '）</h4><ul class="dflist">' +
        df.slice(0, 12).map(d => '<li>' + esc(d.file) + ':' + d.line + ' — ' + esc(d.pattern) + '</li>').join('') + '</ul></div>' : '') +
      (isRemote ? '' :
        '<div class="section"><h4>评分</h4>' + starsHtml(s.rating || 0, s.ratingsCount || 0) +
          '<div class="rate" id="rateWidget" style="margin-top:10px">' +
            [1,2,3,4,5].map(i => '<span data-v="' + i + '">★</span>').join('') + '</div>' +
          '<textarea id="rateComment" placeholder="写下你的评价（可选）" style="width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font);min-height:64px"></textarea>' +
          '<button class="btn-ghost" id="rateBtn" style="margin-top:8px;width:100%">提交评分</button>' +
        '</div>');

    if (!isRemote) {
      const rw = $('#rateWidget'); let picked = 0;
      rw.querySelectorAll('span').forEach(sp => { sp.onclick = () => { picked = +sp.dataset.v; rw.querySelectorAll('span').forEach(x => x.classList.toggle('on', +x.dataset.v <= picked)); }; });
      $('#rateBtn').onclick = async () => {
        if (!picked) { toast('请先点星', 'err'); return; }
        const r = await api('/api/marketplace/skills/' + encodeURIComponent(slug) + '/rate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ stars: picked, comment: $('#rateComment').value }) });
        if (r.error) toast(r.error, 'err'); else { toast('评分成功', 'ok'); openDrawer(slug, false); }
      };
    }

    // foot actions
    const foot = $('#dFoot'); foot.innerHTML = '';
    if (isRemote) {
      if (s.installed) { const b = document.createElement('button'); b.className = 'btn-ghost'; b.textContent = '卸载'; b.onclick = () => doUninstall(slug, () => loadRemote($('#remoteSearch').value.trim(), false)); foot.appendChild(b); }
      else { const b = document.createElement('button'); b.className = 'btn-primary'; b.textContent = '安装'; b.onclick = () => remoteAction(s); foot.appendChild(b); }
    } else {
      if (s.installed) { const b = document.createElement('button'); b.className = 'btn-ghost'; b.textContent = '卸载'; b.onclick = () => doUninstall(slug, reload); foot.appendChild(b); }
      else { const b = document.createElement('button'); b.className = 'btn-primary'; b.textContent = '安装到本机'; b.onclick = () => doInstall(slug, reload); foot.appendChild(b); }
    }
    $('#overlay').classList.add('show'); $('#drawer').classList.add('show');
  }
  function closeDrawer() { $('#overlay').classList.remove('show'); $('#drawer').classList.remove('show'); }
  $('#overlay').onclick = closeDrawer;
  $('#drawerClose').onclick = closeDrawer;

  async function doInstall(slug, refresh) {
    toast('安装中…');
    const r = await api('/api/marketplace/skills/' + encodeURIComponent(slug) + '/install', { method: 'POST' });
    if (r.error) { toast(r.error, 'err'); return; }
    toast('已安装：' + (r.entry ? r.entry.name : slug), 'ok');
    if (r.dangerFlags && r.dangerFlags.length) toast('⚠ 检出 ' + r.dangerFlags.length + ' 处危险脚本，已沙箱安装', 'err');
    closeDrawer(); if (refresh) refresh();
  }
  async function doUninstall(slug, refresh) {
    const r = await api('/api/marketplace/skills/' + encodeURIComponent(slug) + '/uninstall', { method: 'POST' });
    if (r.error) { toast(r.error, 'err'); return; }
    toast('已卸载：' + slug); closeDrawer(); if (refresh) refresh();
  }

  // ══════ Publish Modal ══════
  const modal = $('#modal');
  $('#publishBtn').onclick = () => modal.classList.add('show');
  $('#modalCancel').onclick = () => modal.classList.remove('show');
  modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('show'); };
  $('#modalSubmit').onclick = async () => {
    const body = {
      slug: $('#pSlug').value.trim(), name: $('#pName').value.trim(),
      version: $('#pVersion').value.trim() || '1.0.0', author: 'local',
      description: $('#pDesc').value.trim(), body: $('#pBody').value.trim(),
      category: $('#pCategory').value.trim(),
      tags: $('#pTags').value.split(',').map(t => t.trim()).filter(Boolean),
      permissions: { network: $('#pNet').checked, fileWrite: $('#pWrite').checked, shell: $('#pShell').checked },
      trust: $('#pTrust').value,
    };
    if (!body.slug && !body.name) { toast('请填来源技能名或新建名称', 'err'); return; }
    if (!body.slug && !body.body) { toast('新建模式需填写 SKILL.md 正文', 'err'); return; }
    $('#modalSubmit').textContent = '发布中…';
    const r = await api('/api/marketplace/skills', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    $('#modalSubmit').textContent = '发布';
    if (r.error) { toast(r.error, 'err'); return; }
    toast('已发布：' + (r.entry ? r.entry.name : body.name), 'ok');
    modal.classList.remove('show'); loadCategories(); loadAll();
  };

  // ── 启动 ──
  // 修复①：技能市场以 window.open('/marketplace','_blank') 在新标签打开，用户「返回/前进」时浏览器走
  // bfcache 还原页面，<script> 不会重新执行，导致技能列表停留在空白/骨架态，必须手动刷新。
  // pageshow 在 bfcache 还原（e.persisted === true）时触发，主动重新拉取分类与技能列表。
  function clearSearch() {
    const s = $('#searchInput'); if (s) { s.value = ''; }   // 保留 readonly 属性：阻止浏览器自动填充灌入历史值
    const r = $('#remoteSearch'); if (r) { r.value = ''; }
    state.q = '';
  }
  window.addEventListener('pageshow', (e) => { if (e.persisted) { clearSearch(); loadCategories(); loadAll(); } });
  clearSearch();
  loadCategories();
  loadAll();
})();
</script>
</body>
</html>
